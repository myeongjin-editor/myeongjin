<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글 제목 | Myeongjin Gwak</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* ===== writings 본문 전용 스타일 ===== */
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 100px 20px 60px 20px;
  }

  /* 제목 */
  .writing-title {
    text-align: center;
    font-size: 1.8em;
    line-height: 1.3;
    margin-bottom: 40px;
  }

  /* 본문 */
  .writing-body {
    font-size: 1.05em;
    line-height: 1.75;
    color: #222;
  }

  .writing-body p {
    margin-bottom: 1.6em;
  }

  /* 본문 이미지 */
  .writing-body img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 25px auto;
  }

  /* 출처 */
  .source {
    text-align: right;
    font-size: 0.9em;
    color: #555;
    margin-top: 40px;
  }

  .source a {
    color: #333;
    text-decoration: underline;
  }

  .source a:hover {
    text-decoration: underline;
    opacity: 0.8;
  }

  /* ===== 반응형 ===== */
  @media (max-width: 600px) {
    main {
      padding: 120px 12px 40px 12px;
    }
    .writing-title {
      font-size: 1.4em;
      margin-bottom: 25px;
    }
    .writing-body {
      font-size: 1em;
      line-height: 1.7;
    }
  }
</style>
</head>
<body>

<!-- 헤더 (edited와 동일) -->
<header>
  <div class="header-container">
    <h1><a href="../index.html">myeongjin</a></h1>
    <nav>
      <a href="../edited/index.html">edited</a>
      <a href="index.html">writings</a>
      <a href="../about/index.html">about</a>
    </nav>
  </div>
</header>

<main>
  <!-- 제목 (없을 수도 있음) -->
  <h1 class="writing-title">글 제목</h1>

  <!-- 본문 -->
  <section class="writing-body">
    <p>
      여기 본문 내용을 입력합니다. 단락은 <code>&lt;p&gt;</code>로 구분하고, 필요에 따라
      <code>&lt;br&gt;</code>로 줄바꿈을 추가할 수 있습니다.
    </p>

    <img src="../images/sample_1.jpg" alt="관련 이미지 1">
    <p>
      본문 중간에 이미지를 넣을 수 있습니다. 두 번째 이미지도 같은 방식으로 추가 가능합니다.
    </p>

    <img src="../images/sample_2.jpg" alt="관련 이미지 2">

    <p>
      글의 마지막 단락입니다. 에세이, 서평, 번역문 등 자유롭게 쓸 수 있습니다.
    </p>
  </section>

  <!-- 출처 -->
  <div class="source">
    출처: <a href="https://example.com/original-article" target="_blank">원문 보기</a>
  </div>
</main>

<!-- 홈 버튼 -->
<nav class="home-button">
  <a href="../index.html">Back to Home</a>
</nav>

<footer>
  © 2025 Myeongjin Gwak
</footer>

</body>
</html>
