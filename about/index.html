  <style>
    /* ===== writings 리스트 스타일 (게시판 형식) ===== */
    .writing-list {
      list-style: none;
      padding: 0;
      margin: 0 auto;
      max-width: 800px;
      border-top: 1px solid #ddd;
    }

    .writing-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 18px 10px;
      transition: background-color 0.2s;
    }

    .writing-list li:hover {
      background-color: #fafafa;
    }

    .writing-title {
      flex: 1;
      text-align: left;
    }

    .writing-list a {
      text-decoration: none;
      color: #000;
      font-size: 1.05em;
    }

    .writing-list a:hover {
      text-decoration: underline;
    }

    .writing-date {
      font-size: 0.9em;
      color: #888;
      white-space: nowrap;
      margin-left: 15px;
    }

    @media (max-width: 600px) {
      .writing-list li {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 15px 8px;
      }
      .writing-date {
        margin-left: 0;
        font-size: 0.85em;
      }
    }
  </style>
</head>
